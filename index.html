<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank Plastik V9.0 FINAL</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#059669">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>.scrollbar-hide::-webkit-scrollbar{display:none}@media print{.no-print{display:none!important}}</style>

<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bank Plastik">
</head>
<body class="bg-slate-50">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
function App(){
const [tab,setTab]=useState("dashboard");
const [identity,setIdentity]=useState(()=>{const s=localStorage.getItem('bankIdV90'); return s?JSON.parse(s):{namaBank:"Bank Plastik Soreang <span style="font-size:10px;background:white;color:#059669;padding:2px 6px;border-radius:10px;margin-left:6px">V9.5 INSTALLABLE</span>",alamat:"Jl. Raya Soreang No.123",rt_rw:"01/02",kelurahan:"Soreang",kecamatan:"Soreang",penanggungJawab:"Dendi Sutendi",telp:"0812-xxxx-xxxx",logoBase64:""}});
const [nasabah,setNasabah]=useState(()=>{const s=localStorage.getItem('nsbV90'); return s?JSON.parse(s):[{id:"NSB001",nama:"Siti Aminah",saldo:65000},{id:"NSB002",nama:"Budi Santoso",saldo:0}]});
const [transaksi,setTransaksi]=useState(()=>{const s=localStorage.getItem('trxV90'); return s?JSON.parse(s):[{id:"TRX1",idNasabah:"NSB001",tanggal:new Date().toISOString(),jenis:"setor",keterangan:"Botol 5Kg + Kardus 5Kg",detail:[{jenis:"Botol Plastik",kg:5,harga:3000,total:15000},{jenis:"Kardus",kg:5,harga:2000,total:10000}],totalRp:25000}]});
const [sampahMaster,setSampahMaster]=useState(()=>{const s=localStorage.getItem('smpV90'); return s?JSON.parse(s):[{nama:"Botol Plastik",hargaBeli:3000,hargaJual:5000,stokKg:20},{nama:"Kardus",hargaBeli:2000,hargaJual:3500,stokKg:10},{nama:"Kresek",hargaBeli:1500,hargaJual:2500,stokKg:0}]});
const [sembakoMaster,setSembakoMaster]=useState(()=>{const s=localStorage.getItem('smbV90'); return s?JSON.parse(s):[{nama:"Beras 1Kg",hargaBeli:10000,hargaJual:12000,stok:50},{nama:"Minyak 1L",hargaBeli:12000,hargaJual:15000,stok:30},{nama:"Gula 1Kg",hargaBeli:11000,hargaJual:14000,stok:20}]});
const [kasTransaksi,setKasTransaksi]=useState(()=>{const s=localStorage.getItem('kasV90'); return s?JSON.parse(s):[{id:"KAS1",tanggal:new Date().toISOString(),jenis:"modal_awal",keterangan:"Modal Awal Bank",masuk:100000,keluar:0}]});
const [search,setSearch]=useState(""); const [buku,setBuku]=useState(null);
const [setorId,setSetorId]=useState(""); const [setorItems,setSetorItems]=useState([{jenis:"Botol Plastik",kg:""}]);
const [tarikId,setTarikId]=useState(""); const [tarikMode,setTarikMode]=useState("tunai"); const [tarikRp,setTarikRp]=useState(""); const [tarikKet,setTarikKet]=useState(""); const [tukarItems,setTukarItems]=useState([{nama:"Beras 1Kg",qty:""}]);
// Jual Plastik
const [jualItems,setJualItems]=useState([{jenis:"Botol Plastik",kg:""}]); const [jualKet,setJualKet]=useState("");
// Beli Sembako
const [beliItems,setBeliItems]=useState([{nama:"Beras 1Kg",qty:""}]); const [beliKet,setBeliKet]=useState("");

useEffect(()=>localStorage.setItem('bankIdV90',JSON.stringify(identity)),[identity]);
useEffect(()=>localStorage.setItem('nsbV90',JSON.stringify(nasabah)),[nasabah]);
useEffect(()=>localStorage.setItem('trxV90',JSON.stringify(transaksi)),[transaksi]);
useEffect(()=>localStorage.setItem('smpV90',JSON.stringify(sampahMaster)),[sampahMaster]);
useEffect(()=>localStorage.setItem('smbV90',JSON.stringify(sembakoMaster)),[sembakoMaster]);
useEffect(()=>localStorage.setItem('kasV90',JSON.stringify(kasTransaksi)),[kasTransaksi]);

const handleLogo=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setIdentity({...identity,logoBase64:ev.target.result});r.readAsDataURL(f)};
const filtered=nasabah.filter(n=>n.nama.toLowerCase().includes(search.toLowerCase()));
const tabs=[{id:"dashboard",label:"Dashboard"},{id:"identitas",label:"Identitas"},{id:"nasabah",label:"Nasabah"},{id:"setor",label:"Setor"},{id:"tarik",label:"Tarik"},{id:"stok",label:"Stok"},{id:"jual",label:"Jual Plastik"},{id:"beli",label:"Beli Sembako"},{id:"keuangan",label:"Keuangan"},{id:"master",label:"Master"},{id:"laporan",label:"Laporan"},{id:"buku",label:"Buku"},{id:"export",label:"Export"}];

const totalStokKg=sampahMaster.reduce((a,b)=>a+b.stokKg,0);
const totalNilaiBeli=sampahMaster.reduce((a,b)=>a+b.stokKg*b.hargaBeli,0);
const totalNilaiJual=sampahMaster.reduce((a,b)=>a+b.stokKg*b.hargaJual,0);
const totalSaldo=nasabah.reduce((a,b)=>a+b.saldo,0);
const totalSetor=transaksi.filter(t=>t.jenis==="setor").reduce((a,b)=>a+b.totalRp,0);
const totalTarik=transaksi.filter(t=>t.jenis==="tarik").reduce((a,b)=>a+b.totalRp,0);
const kasMasuk=kasTransaksi.reduce((a,b)=>a+b.masuk,0);
const kasKeluar=kasTransaksi.reduce((a,b)=>a+b.keluar,0);
const kasSaldo=kasMasuk-kasKeluar;
const labaKotor=totalNilaiJual-totalNilaiBeli;
const labaBersih=kasSaldo-totalSaldo;

const calcSetor=()=>setorItems.reduce((s,it)=>{const m=sampahMaster.find(x=>x.nama===it.jenis); return s+(parseFloat(it.kg)||0)*(m?m.hargaBeli:0)},0);
const calcTukar=()=>tukarItems.reduce((s,it)=>{const m=sembakoMaster.find(x=>x.nama===it.nama); return s+(parseInt(it.qty)||0)*(m?m.hargaJual:0)},0);
const calcJual=()=>jualItems.reduce((s,it)=>{const m=sampahMaster.find(x=>x.nama===it.jenis); return s+(parseFloat(it.kg)||0)*(m?m.hargaJual:0)},0);
const calcBeli=()=>beliItems.reduce((s,it)=>{const m=sembakoMaster.find(x=>x.nama===it.nama); return s+(parseInt(it.qty)||0)*(m?m.hargaBeli:0)},0);

const doSetor=()=>{if(!setorId){alert("Pilih nasabah");return} const valid=setorItems.filter(it=>it.kg&&parseFloat(it.kg)>0); if(!valid.length){alert("Isi Kg");return} const detail=valid.map(it=>{const m=sampahMaster.find(s=>s.nama===it.jenis); return {jenis:it.jenis,kg:parseFloat(it.kg),harga:m?m.hargaBeli:0,total:parseFloat(it.kg)*(m?m.hargaBeli:0)}}); const total=detail.reduce((a,b)=>a+b.total,0); const ket=detail.map(d=>d.jenis+" "+d.kg+"Kg").join(" + "); const trx={id:"TRX"+Date.now(),idNasabah:setorId,tanggal:new Date().toISOString(),jenis:"setor",keterangan:ket,detail,totalRp:total}; setTransaksi([...transaksi,trx]); setNasabah(nasabah.map(n=>n.id===setorId?{...n,saldo:n.saldo+total}:n)); let ns=[...sampahMaster]; detail.forEach(d=>{ns=ns.map(s=>s.nama===d.jenis?{...s,stokKg:s.stokKg+d.kg}:s)}); setSampahMaster(ns); setSetorItems([{jenis:"Botol Plastik",kg:""}]); alert("Setor Rp "+total.toLocaleString()+" sukses!")};
const doTarik=()=>{if(!tarikId){alert("Pilih nasabah");return} const nsb=nasabah.find(n=>n.id===tarikId); let total=0; let ket=""; if(tarikMode==="tunai"){if(!tarikRp){alert("Isi Rp");return} total=parseInt(tarikRp); ket=tarikKet||"Tarik Tunai";}else{const valid=tukarItems.filter(it=>it.qty&&parseInt(it.qty)>0); if(!valid.length){alert("Isi qty");return} total=valid.reduce((s,it)=>{const m=sembakoMaster.find(x=>x.nama===it.nama); return s+(parseInt(it.qty)||0)*(m?m.hargaJual:0)},0); ket="Tukar: "+valid.map(it=>it.nama+" x"+it.qty).join(", "); let ns=[...sembakoMaster]; for(const it of valid){const m=ns.find(s=>s.nama===it.nama); if(m&&m.stok<parseInt(it.qty)){alert("Stok "+it.nama+" kurang!"); return} ns=ns.map(s=>s.nama===it.nama?{...s,stok:s.stok-parseInt(it.qty)}:s)} setSembakoMaster(ns);} if(!nsb||nsb.saldo<total){alert("Saldo kurang! Saldo Rp "+(nsb?nsb.saldo:0));return} const trx={id:"TRX"+Date.now(),idNasabah:tarikId,tanggal:new Date().toISOString(),jenis:"tarik",keterangan:ket+" ("+tarikMode+")",detail:[],totalRp:total}; setTransaksi([...transaksi,trx]); setNasabah(nasabah.map(n=>n.id===tarikId?{...n,saldo:n.saldo-total}:n)); setTarikRp(""); setTarikKet(""); setTukarItems([{nama:"Beras 1Kg",qty:""}]); alert("Tarik Rp "+total.toLocaleString()+" sukses!")};

const doJualPlastik=()=>{
  const valid=jualItems.filter(it=>it.kg&&parseFloat(it.kg)>0); if(!valid.length){alert("Isi Kg");return}
  for(const it of valid){const m=sampahMaster.find(s=>s.nama===it.jenis); if(m&&m.stokKg<parseFloat(it.kg)){alert(`Stok ${it.jenis} kurang! Stok: ${m.stokKg}Kg`); return}}
  const detail=valid.map(it=>{const m=sampahMaster.find(s=>s.nama===it.jenis); return {jenis:it.jenis,kg:parseFloat(it.kg),harga:m?m.hargaJual:0,total:parseFloat(it.kg)*(m?m.hargaJual:0)}});
  const total=detail.reduce((a,b)=>a+b.total,0);
  let ns=[...sampahMaster]; detail.forEach(d=>{ns=ns.map(s=>s.nama===d.jenis?{...s,stokKg:s.stokKg-d.kg}:s)}); setSampahMaster(ns);
  const kas={id:"KAS"+Date.now(),tanggal:new Date().toISOString(),jenis:"jual_plastik",keterangan:"Jual ke Pengepul: "+detail.map(d=>d.jenis+" "+d.kg+"Kg").join(" + ")+(jualKet?" - "+jualKet:""),masuk:total,keluar:0};
  setKasTransaksi([...kasTransaksi,kas]);
  setJualItems([{jenis:"Botol Plastik",kg:""}]); setJualKet(""); alert(`✅ Jual Plastik Rp ${total.toLocaleString()} ke pengepul sukses! Masuk kas. Laba: Rp ${(total-detail.reduce((a,b)=>a+b.kg*(sampahMaster.find(s=>s.nama===b.jenis).hargaBeli),0)).toLocaleString()}`);
};

const doBeliSembako=()=>{
  const valid=beliItems.filter(it=>it.qty&&parseInt(it.qty)>0); if(!valid.length){alert("Isi Qty");return}
  const detail=valid.map(it=>{const m=sembakoMaster.find(s=>s.nama===it.nama); return {nama:it.nama,qty:parseInt(it.qty),harga:m?m.hargaBeli:0,total:parseInt(it.qty)*(m?m.hargaBeli:0)}});
  const total=detail.reduce((a,b)=>a+b.total,0);
  if(kasSaldo<total){if(!confirm(`Kas tidak cukup! Kas: Rp ${kasSaldo.toLocaleString()} | Butuh: Rp ${total.toLocaleString()}. Tetap beli? (Kas jadi minus)`)) return}
  let ns=[...sembakoMaster]; detail.forEach(d=>{ns=ns.map(s=>s.nama===d.nama?{...s,stok:s.stok+d.qty}:s)}); setSembakoMaster(ns);
  const kas={id:"KAS"+Date.now(),tanggal:new Date().toISOString(),jenis:"beli_sembako",keterangan:"Beli dari Grosir/Agen: "+detail.map(d=>d.nama+" x"+d.qty).join(" + ")+(beliKet?" - "+beliKet:""),masuk:0,keluar:total};
  setKasTransaksi([...kasTransaksi,kas]);
  setBeliItems([{nama:"Beras 1Kg",qty:""}]); setBeliKet(""); alert(`✅ Beli Sembako Rp ${total.toLocaleString()} dari grosir sukses! Stok nambah, kas keluar.`);
};

const exportExcel=(type)=>{const wb=XLSX.utils.book_new(); if(type==="nasabah"||type==="semua"){const ws=XLSX.utils.json_to_sheet(nasabah.map(n=>({ID:n.id,Nama:n.nama,Saldo:n.saldo}))); XLSX.utils.book_append_sheet(wb,ws,"Nasabah")} if(type==="transaksi"||type==="semua"){const ws=XLSX.utils.json_to_sheet(transaksi.map(t=>{const nsb=nasabah.find(n=>n.id===t.idNasabah); return {Tanggal:new Date(t.tanggal).toLocaleString('id-ID'),ID:t.idNasabah,Nama:nsb?nsb.nama:'',Jenis:t.jenis,Keterangan:t.keterangan,Total:t.totalRp}})); XLSX.utils.book_append_sheet(wb,ws,"Transaksi")} if(type==="kas"||type==="semua"){const ws=XLSX.utils.json_to_sheet(kasTransaksi.map(k=>({Tanggal:new Date(k.tanggal).toLocaleString('id-ID'),Jenis:k.jenis,Keterangan:k.keterangan,Masuk:k.masuk,Keluar:k.keluar}))); XLSX.utils.book_append_sheet(wb,ws,"Kas")} if(type==="stok"||type==="semua"){const ws=XLSX.utils.json_to_sheet(sampahMaster.map(s=>({Jenis:s.nama,Beli:s.hargaBeli,Jual:s.hargaJual,StokKg:s.stokKg,NilaiBeli:s.stokKg*s.hargaBeli,NilaiJual:s.stokKg*s.hargaJual}))); XLSX.utils.book_append_sheet(wb,ws,"Stok Sampah"); const ws2=XLSX.utils.json_to_sheet(sembakoMaster.map(s=>({Nama:s.nama,Beli:s.hargaBeli,Jual:s.hargaJual,Stok:s.stok}))); XLSX.utils.book_append_sheet(wb,ws2,"Stok Sembako")} XLSX.writeFile(wb,"Bank_Plastik_"+type+"_"+new Date().toISOString().slice(0,10)+".xlsx");};

const trxBuku=buku?transaksi.filter(t=>t.idNasabah===buku.id).sort((a,b)=>new Date(a.tanggal)-new Date(b.tanggal)):[];
let run=0; const trxRun=trxBuku.map(t=>{if(t.jenis==="setor") run+=t.totalRp; else run-=t.totalRp; return {...t,saldoAkhir:run}});

return (<div>
<header className="bg-emerald-700 text-white p-3 flex gap-3 items-center">
{identity.logoBase64?<img src={identity.logoBase64} className="w-12 h-12 rounded-full border-2 border-white object-cover"/>:<div className="w-12 h-12 rounded-full bg-white text-emerald-700 flex items-center justify-center font-bold">BP</div>}
<div className="flex-1"><div className="font-bold">{identity.namaBank} <span className="text-xs bg-white text-emerald-700 px-2 py-1 rounded-full ml-2">V9.0 FINAL</span></div><div className="text-xs opacity-90">Saldo Nasabah Rp {totalSaldo.toLocaleString()} | Kas Rp {kasSaldo.toLocaleString()} | Stok {totalStokKg}Kg</div></div>
</header>
<nav className="bg-white p-2 flex gap-2 overflow-x-auto scrollbar-hide sticky top-0 z-40 border-b shadow-sm">
{tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-2 rounded-full whitespace-nowrap text-xs font-medium ${tab===t.id?'bg-emerald-600 text-white':'bg-slate-100'}`}>{t.label}</button>)}
</nav>
<main className="p-3 space-y-3 pb-20">

{tab==="dashboard"&&<div className="space-y-3">
<div className="bg-white p-4 rounded-xl shadow"><div className="font-bold">Dashboard V9.0 FINAL ✅</div><div className="grid grid-cols-2 gap-2 mt-3">
<div className="bg-slate-50 p-3 rounded"><div className="text-xs">Nasabah / Saldo</div><div className="font-bold">{nasabah.length} Org</div><div className="text-xs">Rp {totalSaldo.toLocaleString()}</div></div>
<div className="bg-blue-50 p-3 rounded"><div className="text-xs">Kas Bank</div><div className="font-bold text-blue-700">Rp {kasSaldo.toLocaleString()}</div><div className="text-xs">Masuk Rp {kasMasuk.toLocaleString()} - Keluar Rp {kasKeluar.toLocaleString()}</div></div>
<div className="bg-orange-50 p-3 rounded"><div className="text-xs">Stok Sampah</div><div className="font-bold">{totalStokKg}Kg</div><div className="text-xs">Beli Rp {totalNilaiBeli.toLocaleString()} | Jual Rp {totalNilaiJual.toLocaleString()}</div></div>
<div className="bg-emerald-50 p-3 rounded"><div className="text-xs">Laba Bersih</div><div className="font-bold text-emerald-700">Rp {labaBersih.toLocaleString()}</div><div className="text-xs">Kas - Saldo Nasabah</div></div>
</div></div>
<div className="grid grid-cols-2 gap-2">
<button onClick={()=>setTab('jual')} className="bg-purple-600 text-white p-3 rounded-xl text-xs font-bold">💰 Jual Plastik ke Pengepul</button>
<button onClick={()=>setTab('beli')} className="bg-orange-600 text-white p-3 rounded-xl text-xs font-bold">🛒 Beli Sembako dari Grosir</button>
</div>
</div>}

{tab==="stok"&&<div className="space-y-3">
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-2">📦 Stok Sampah V9.0 - Ada Harga Beli & Jual</div>
<table className="w-full text-xs"><thead><tr className="bg-slate-100"><th className="p-2 text-left">Jenis</th><th className="p-2">Beli</th><th className="p-2">Jual</th><th className="p-2">Kg</th><th className="p-2 text-right">Laba/Kg</th></tr></thead><tbody>{sampahMaster.map(s=><tr key={s.nama} className="border-b"><td className="p-2">{s.nama}</td><td className="p-2 text-center">{s.hargaBeli}</td><td className="p-2 text-center font-bold text-purple-600">{s.hargaJual}</td><td className="p-2 text-center font-bold">{s.stokKg}</td><td className="p-2 text-right text-green-600">+{s.hargaJual-s.hargaBeli}</td></tr>)}</tbody></table>
<div className="mt-2 p-2 bg-orange-50 rounded text-xs">Nilai Beli: Rp {totalNilaiBeli.toLocaleString()} | Nilai Jual: Rp {totalNilaiJual.toLocaleString()} | Laba Kotor: Rp {labaKotor.toLocaleString()}</div>
</div>
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-2">🛒 Stok Sembako V9.0 - Muncul di Tab Stok! ✅</div>
<table className="w-full text-xs"><thead><tr className="bg-slate-100"><th className="p-2 text-left">Nama</th><th className="p-2">Beli</th><th className="p-2">Jual</th><th className="p-2">Stok</th><th className="p-2 text-right">Laba</th></tr></thead><tbody>{sembakoMaster.map(s=><tr key={s.nama} className="border-b"><td className="p-2">{s.nama}</td><td className="p-2 text-center">{s.hargaBeli}</td><td className="p-2 text-center font-bold text-emerald-600">{s.hargaJual}</td><td className="p-2 text-center font-bold">{s.stok}</td><td className="p-2 text-right text-green-600">+{s.hargaJual-s.hargaBeli}</td></tr>)}</tbody></table>
</div>
</div>}

{tab==="master"&&<div className="space-y-3">
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-2">♻️ Master Sampah - Edit Harga Beli & Jual V9.0 ✅</div>
<div className="text-xs bg-yellow-50 border p-2 rounded mb-2">Sekarang ada 2 harga: Harga Beli dari nasabah & Harga Jual ke pengepul. Laba = Jual - Beli</div>
{sampahMaster.map((s,i)=><div key={i} className="flex gap-1 mb-2 items-center">
<input value={s.nama} onChange={e=>{const a=[...sampahMaster]; a[i].nama=e.target.value; setSampahMaster(a)}} className="flex-1 border p-2 rounded text-xs"/>
<input type="number" value={s.hargaBeli} onChange={e=>{const a=[...sampahMaster]; a[i].hargaBeli=parseInt(e.target.value)||0; setSampahMaster(a)}} className="w-20 border p-2 rounded text-xs" placeholder="Beli"/>
<input type="number" value={s.hargaJual} onChange={e=>{const a=[...sampahMaster]; a[i].hargaJual=parseInt(e.target.value)||0; setSampahMaster(a)}} className="w-20 border p-2 rounded text-xs bg-purple-50" placeholder="Jual"/>
<span className="text-xs w-10">{s.stokKg}Kg</span>
<button onClick={()=>setSampahMaster(sampahMaster.filter((_,idx)=>idx!==i))} className="bg-red-100 text-red-600 px-2 py-2 rounded text-xs">X</button>
</div>)}
<button onClick={()=>setSampahMaster([...sampahMaster,{nama:"Baru",hargaBeli:1000,hargaJual:2000,stokKg:0}])} className="w-full bg-emerald-50 py-2 rounded border font-bold text-xs">+ Tambah Sampah</button>
</div>
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-2">🛒 Master Sembako - Edit Harga Beli & Jual V9.0 ✅ (Koreksi Kamu)</div>
<div className="text-xs bg-blue-50 border p-2 rounded mb-2">Harga Beli dari grosir/agen & Harga Jual ke nasabah. Edit di sini!</div>
{sembakoMaster.map((s,i)=><div key={i} className="flex gap-1 mb-2 items-center">
<input value={s.nama} onChange={e=>{const a=[...sembakoMaster]; a[i].nama=e.target.value; setSembakoMaster(a)}} className="flex-1 border p-2 rounded text-xs"/>
<input type="number" value={s.hargaBeli} onChange={e=>{const a=[...sembakoMaster]; a[i].hargaBeli=parseInt(e.target.value)||0; setSembakoMaster(a)}} className="w-20 border p-2 rounded text-xs" placeholder="Beli Grosir"/>
<input type="number" value={s.hargaJual} onChange={e=>{const a=[...sembakoMaster]; a[i].hargaJual=parseInt(e.target.value)||0; setSembakoMaster(a)}} className="w-20 border p-2 rounded text-xs bg-emerald-50 font-bold" placeholder="Jual Nasabah"/>
<input type="number" value={s.stok} onChange={e=>{const a=[...sembakoMaster]; a[i].stok=parseInt(e.target.value)||0; setSembakoMaster(a)}} className="w-14 border p-2 rounded text-xs" placeholder="Stok"/>
<button onClick={()=>setSembakoMaster(sembakoMaster.filter((_,idx)=>idx!==i))} className="bg-red-100 px-2 py-2 rounded text-xs">X</button>
</div>)}

<button onClick={()=>setJualItems(jualItems.filter((_,i)=>i!==idx))} className="bg-red-100 text-red-600 px-3 rounded-lg">X</button>
</div>)}
<button onClick={()=>setJualItems([...jualItems,{jenis:"Botol Plastik",kg:""}])} className="w-full bg-slate-100 py-2 rounded-lg text-xs">+ Tambah Jenis</button>
<div className="bg-purple-50 border-2 border-purple-300 p-3 rounded-lg font-bold text-center">Total Jual ke Pengepul: Rp {calcJual().toLocaleString()}</div>
<input value={jualKet} onChange={e=>setJualKet(e.target.value)} placeholder="Keterangan (Pengepul A, nota...)" className="w-full border p-3 rounded-lg text-sm"/>
<button onClick={doJualPlastik} className="w-full bg-purple-600 text-white py-3 rounded-lg font-bold">💰 Simpan Penjualan ke Pengepul - Masuk Kas</button>
<div className="text-xs text-slate-500">Riwayat: {kasTransaksi.filter(k=>k.jenis==="jual_plastik").slice(-3).map(k=>k.keterangan).join(" | ")||"Belum ada"}</div>
</div>}

{tab==="beli"&&<div className="bg-white p-4 rounded-xl shadow space-y-3">
<div className="font-bold">🛒 Beli Sembako dari Grosir/Agen V9.0 - BARU! ✅</div>
<div className="bg-orange-50 border border-orange-200 p-3 rounded text-xs">Catat pembelian sembako dari grosir/agen. Stok sembako nambah, uang keluar dari Kas Bank.</div>
<div className="bg-slate-50 p-3 rounded text-xs">Kas Saat Ini: Rp {kasSaldo.toLocaleString()} | Stok Sembako: {sembakoMaster.map(s=>`${s.nama} ${s.stok}`).join(" | ")}</div>
{beliItems.map((it,idx)=><div key={idx} className="flex gap-2">
<select value={it.nama} onChange={e=>{const a=[...beliItems]; a[idx].nama=e.target.value; setBeliItems(a)}} className="flex-1 border p-3 rounded-lg text-sm">{sembakoMaster.map(s=><option key={s.nama} value={s.nama}>{s.nama} Stok {s.stok} Beli {s.hargaBeli} Jual {s.hargaJual}</option>)}</select>
<input type="number" value={it.qty} onChange={e=>{const a=[...beliItems]; a[idx].qty=e.target.value; setBeliItems(a)}} placeholder="Qty" className="w-16 border p-3 rounded-lg"/>
<button onClick={()=>setBeliItems(beliItems.filter((_,i)=>i!==idx))} className="bg-red-100 text-red-600 px-3 rounded-lg">X</button>
</div>)}
<button onClick={()=>setBeliItems([...beliItems,{nama:"Beras 1Kg",qty:""}])} className="w-full bg-slate-100 py-2 rounded-lg text-xs">+ Tambah Sembako</button>
<div className="bg-orange-50 border-2 border-orange-300 p-3 rounded-lg font-bold text-center">Total Beli dari Grosir: Rp {calcBeli().toLocaleString()}</div>
<input value={beliKet} onChange={e=>setBeliKet(e.target.value)} placeholder="Keterangan (Grosir Soreang, nota...)" className="w-full border p-3 rounded-lg text-sm"/>

</div>}

<div className="flex justify-between border-b py-2"><span>Total Tarik Keluar</span><b className="text-red-600">Rp {totalTarik.toLocaleString()}</b></div>

</div>
</div>

</div>
</div>}

{tab==="tarik"&&<div className="bg-white p-4 rounded-xl shadow space-y-3"><div className="font-bold">💸 Tarik</div><select value={tarikId} onChange={e=>setTarikId(e.target.value)} className="w-full border p-3 rounded-lg"><option value="">Pilih Nasabah</option>{nasabah.map(n=><option key={n.id} value={n.id}>{n.nama} - Rp {n.saldo.toLocaleString()}</option>)}</select><div className="flex gap-2"><button onClick={()=>setTarikMode('tunai')} className={`flex-1 py-3 rounded-lg font-bold ${tarikMode==='tunai'?'bg-emerald-600 text-white':'bg-slate-100'}`}>Tunai</button><button onClick={()=>setTarikMode('sembako')} className={`flex-1 py-3 rounded-lg font-bold ${tarikMode==='sembako'?'bg-emerald-600 text-white':'bg-slate-100'}`}>Sembako</button></div>{tarikMode==='tunai'?<input type="number" value={tarikRp} onChange={e=>setTarikRp(e.target.value)} placeholder="Rp" className="w-full border p-3 rounded-lg"/>:<div>{tukarItems.map((it,idx)=><div key={idx} className="flex gap-2 mb-2"><select value={it.nama} onChange={e=>{const a=[...tukarItems]; a[idx].nama=e.target.value; setTukarItems(a)}} className="flex-1 border p-3 rounded-lg">{sembakoMaster.map(s=><option key={s.nama} value={s.nama}>{s.nama} @Rp {s.hargaJual} Stok {s.stok}</option>)}</select><input type="number" value={it.qty} onChange={e=>{const a=[...tukarItems]; a[idx].qty=e.target.value; setTukarItems(a)}} placeholder="Qty" className="w-20 border p-3 rounded-lg"/><button onClick={()=>setTukarItems(tukarItems.filter((_,i)=>i!==idx))} className="bg-red-100 px-3 rounded">X</button></div>)}<div className="bg-blue-50 p-3 rounded font-bold text-center">Total: Rp {calcTukar().toLocaleString()}</div></div>}<button onClick={doTarik} className="w-full bg-red-600 text-white py-3 rounded-lg font-bold">Tarik</button></div>}
{tab==="identitas"&&<div className="bg-white p-4 rounded-xl shadow space-y-2"><div className="font-bold">Identitas</div><input value={identity.namaBank} onChange={e=>setIdentity({...identity,namaBank:e.target.value})} className="w-full border p-3 rounded-lg"/><input value={identity.alamat} onChange={e=>setIdentity({...identity,alamat:e.target.value})} className="w-full border p-3 rounded-lg"/><button className="w-full bg-emerald-600 text-white py-3 rounded-lg">Simpan</button></div>}
{tab==="nasabah"&&<div className="bg-white p-4 rounded-xl shadow"><div className="flex gap-2 mb-3"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari..." className="flex-1 border p-3 rounded-lg"/><button onClick={()=>{const n=prompt('Nama:'); if(!n)return; setNasabah([...nasabah,{id:'NSB'+String(nasabah.length+1).padStart(3,'0'),nama:n,saldo:0}])}} className="bg-emerald-600 text-white px-4 rounded-lg">+ Baru</button></div>{filtered.map(n=><div key={n.id} className="border p-3 rounded flex justify-between mb-2"><div><div className="font-bold">{n.nama}</div><div className="text-sm">Rp {n.saldo.toLocaleString()}</div></div><button onClick={()=>{setBuku(n); setTab('buku')}} className="text-xs bg-emerald-50 px-2 py-1 rounded">Buku</button></div>)}</div>}
{tab==="laporan"&&<div className="bg-white p-4 rounded-xl shadow"><div className="font-bold mb-2">Laporan</div><div className="space-y-2 max-h-96 overflow-auto">{transaksi.slice().reverse().map(t=>{const nsb=nasabah.find(n=>n.id===t.idNasabah); return <div key={t.id} className="border p-2 rounded text-xs flex justify-between"><div><div className="font-bold">{nsb?nsb.nama:t.idNasabah} - {t.jenis}</div><div>{t.keterangan}</div></div><div className="font-bold">{t.jenis==='setor'?'+':'-'}Rp {t.totalRp.toLocaleString()}</div></div>})}</div></div>}
{tab==="buku"&&<div className="space-y-3"><div className="bg-white p-4 rounded-xl shadow no-print"><div className="font-bold">Buku Tabungan V9.0</div><input value={search} onChange={e=>{setSearch(e.target.value); setBuku(null)}} placeholder="Cari nasabah..." className="w-full border p-3 rounded-lg mt-2"/>{search&&!buku&&<div className="border rounded max-h-40 overflow-auto mt-2">{filtered.map(n=><div key={n.id} onClick={()=>{setBuku(n); setSearch('')}} className="p-2 border-b cursor-pointer">{n.nama}</div>)}</div>}</div>{buku&&<div className="bg-white p-6 rounded-xl shadow"><div className="text-center border-b-2 border-emerald-700 pb-3 mb-3"><div className="font-bold text-lg">{identity.namaBank}</div><div className="text-xs">{identity.alamat} {identity.kelurahan}</div><div className="font-bold text-emerald-700 mt-2">BUKU TABUNGAN</div></div><div className="text-sm mb-3">{buku.nama} - Rp {buku.saldo.toLocaleString()}</div><table className="w-full text-xs border"><thead><tr className="bg-emerald-700 text-white"><th className="p-2 border">Tgl</th><th className="p-2 border">Ket</th><th className="p-2 border">Masuk</th><th className="p-2 border">Saldo</th></tr></thead><tbody>{trxRun.map(t=><tr key={t.id} className="border-b"><td className="p-2 border">{new Date(t.tanggal).toLocaleDateString('id-ID')}</td><td className="p-2 border">{t.keterangan}</td><td className="p-2 border text-right">Rp {t.totalRp.toLocaleString()}</td><td className="p-2 border text-right font-bold">Rp {t.saldoAkhir.toLocaleString()}</td></tr>)}</tbody></table><button onClick={()=>window.print()} className="w-full bg-slate-800 text-white py-3 rounded mt-6 no-print">Cetak</button></div>}</div>}
{tab==="export"&&<div className="space-y-3"><div className="bg-white p-4 rounded-xl shadow space-y-2"><div className="font-bold">📊 Export Excel V9.0 + Reset</div><button onClick={()=>exportExcel('nasabah')} className="w-full bg-emerald-600 text-white py-3 rounded-lg">Export Nasabah</button><button onClick={()=>exportExcel('transaksi')} className="w-full bg-blue-600 text-white py-3 rounded-lg">Export Transaksi</button><button onClick={()=>exportExcel('kas')} className="w-full bg-purple-600 text-white py-3 rounded-lg">Export Kas (Jual/Beli)</button><button onClick={()=>exportExcel('semua')} className="w-full bg-slate-800 text-white py-3 rounded-lg font-bold">Export SEMUA</button></div><div className="bg-white p-4 rounded-xl shadow space-y-2 border-2 border-red-200"><div className="font-bold text-red-700">Reset Data</div><button onClick={()=>{if(confirm('Reset Transaksi?')){setTransaksi([]); setNasabah(nasabah.map(n=>({...n,saldo:0}))); setSampahMaster(sampahMaster.map(s=>({...s,stokKg:0})));}}} className="w-full bg-orange-600 text-white py-3 rounded-lg">Reset Transaksi & Saldo Jadi 0</button><button onClick={()=>{if(confirm('Reset Total?')){localStorage.clear(); location.reload();}}} className="w-full bg-black text-white py-3 rounded-lg">RESET TOTAL</button></div></div>}

</main>
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
