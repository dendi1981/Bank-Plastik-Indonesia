<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank Plastik V9.5 FINAL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#059669">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>.scrollbar-hide::-webkit-scrollbar{display:none}@media print{.no-print{display:none!important}}</style>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bank Plastik">
</head>
<body class="bg-slate-50">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
function safeParse(k, fb){try{const r=localStorage.getItem(k); return r?JSON.parse(r):fb}catch(e){return fb}}
function App(){
const [tab,setTab]=useState("dashboard");
const [identity,setIdentity]=useState(()=>safeParse('bankIdV95', safeParse('bankIdV92', safeParse('bankIdV91', {namaBank:"Bank Plastik Soreang",alamat:"Jl. Raya Soreang No.123",rt_rw:"01/02",kelurahan:"Soreang",kecamatan:"Soreang",kabupaten:"Bandung",penanggungJawab:"Dendi Sutendi",telp:"0812-3456-7890",logoBase64:""}))));
const [nasabah,setNasabah]=useState(()=>safeParse('nsbV95', safeParse('nsbV92', [{id:"NSB001",nama:"Siti Aminah",saldo:65000},{id:"NSB002",nama:"Budi Santoso",saldo:0}])));
const [transaksi,setTransaksi]=useState(()=>safeParse('trxV95', safeParse('trxV92', [{id:"TRX1",idNasabah:"NSB001",tanggal:new Date().toISOString(),jenis:"setor",keterangan:"Botol 5Kg + Kardus 5Kg",totalRp:25000}])));
const [sampahMaster,setSampahMaster]=useState(()=>{
  const raw=safeParse('smpV95', safeParse('smpV92', null));
  if(!raw) return [{nama:"Botol Plastik",hargaBeli:3000,hargaJual:5000,stokKg:20},{nama:"Kardus",hargaBeli:2000,hargaJual:3500,stokKg:10}];
  return raw.map(x=>({nama:x.nama||"Jenis",hargaBeli:x.hargaBeli||x.harga||3000,hargaJual:x.hargaJual||((x.hargaBeli||x.harga||3000)+2000),stokKg:x.stokKg||0}));
});
const [sembakoMaster,setSembakoMaster]=useState(()=>{
  const raw=safeParse('smbV95', safeParse('smbV92', null));
  if(!raw) return [{nama:"Beras 1Kg",hargaBeli:10000,hargaJual:12000,stok:50},{nama:"Minyak 1L",hargaBeli:12000,hargaJual:15000,stok:30}];
  return raw.map(x=>({nama:x.nama||"Sembako",hargaBeli:x.hargaBeli||x.harga||10000,hargaJual:x.hargaJual||((x.hargaBeli||x.harga||10000)+2000),stok:x.stok||0}));
});
const [kasTransaksi,setKasTransaksi]=useState(()=>safeParse('kasV95', safeParse('kasV92', [{id:"KAS1",tanggal:new Date().toISOString(),jenis:"modal_awal",keterangan:"Modal Awal",masuk:100000,keluar:0}])));
const [search,setSearch]=useState(""); const [buku,setBuku]=useState(null);
const [setorId,setSetorId]=useState(""); const [setorItems,setSetorItems]=useState([{jenis:"Botol Plastik",kg:""}]);
const [tarikId,setTarikId]=useState(""); const [tarikMode,setTarikMode]=useState("tunai"); const [tarikRp,setTarikRp]=useState(""); const [tukarItems,setTukarItems]=useState([{nama:"Beras 1Kg",qty:""}]);
const [jualItems,setJualItems]=useState([{jenis:"Botol Plastik",kg:""}]); const [jualKet,setJualKet]=useState("");
const [beliItems,setBeliItems]=useState([{nama:"Beras 1Kg",qty:""}]); const [beliKet,setBeliKet]=useState("");

useEffect(()=>{localStorage.setItem('bankIdV95',JSON.stringify(identity))},[identity]);
useEffect(()=>{localStorage.setItem('nsbV95',JSON.stringify(nasabah))},[nasabah]);
useEffect(()=>{localStorage.setItem('trxV95',JSON.stringify(transaksi))},[transaksi]);
useEffect(()=>{localStorage.setItem('smpV95',JSON.stringify(sampahMaster))},[sampahMaster]);
useEffect(()=>{localStorage.setItem('smbV95',JSON.stringify(sembakoMaster))},[sembakoMaster]);
useEffect(()=>{localStorage.setItem('kasV95',JSON.stringify(kasTransaksi))},[kasTransaksi]);

const handleLogo=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setIdentity({...identity,logoBase64:ev.target.result});r.readAsDataURL(f)};
const filtered=nasabah.filter(n=>{try{return n.nama.toLowerCase().includes(search.toLowerCase())}catch(e){return true}});
const tabs=[{id:"dashboard",label:"Dashboard"},{id:"identitas",label:"Identitas"},{id:"nasabah",label:"Nasabah"},{id:"setor",label:"Setor"},{id:"tarik",label:"Tarik"},{id:"stok",label:"Stok"},{id:"jual",label:"Jual Plastik"},{id:"beli",label:"Beli Sembako"},{id:"keuangan",label:"Keuangan"},{id:"master",label:"Master"},{id:"laporan",label:"Laporan"},{id:"buku",label:"Buku"},{id:"export",label:"Export"}];
const hb=s=>{try{return s.hargaBeli||s.harga||0}catch(e){return 0}};
const hj=s=>{try{return s.hargaJual||((s.hargaBeli||s.harga||0)+2000)}catch(e){return 0}};
const totalStokKg=sampahMaster.reduce((a,b)=>a+(b.stokKg||0),0);
const totalNilaiBeli=sampahMaster.reduce((a,b)=>a+(b.stokKg||0)*hb(b),0);
const totalNilaiJual=sampahMaster.reduce((a,b)=>a+(b.stokKg||0)*hj(b),0);
const totalSaldo=nasabah.reduce((a,b)=>a+(b.saldo||0),0);
const kasMasuk=kasTransaksi.reduce((a,b)=>a+(b.masuk||0),0);
const kasKeluar=kasTransaksi.reduce((a,b)=>a+(b.keluar||0),0);
const kasSaldo=kasMasuk-kasKeluar;
const labaBersih=kasSaldo-totalSaldo;

const calcSetor=()=>setorItems.reduce((s,it)=>{const m=sampahMaster.find(x=>x.nama===it.jenis); return s+(parseFloat(it.kg)||0)*(m?hb(m):0)},0);
const calcTukar=()=>tukarItems.reduce((s,it)=>{const m=sembakoMaster.find(x=>x.nama===it.nama); return s+(parseInt(it.qty)||0)*(m?hj(m):0)},0);
const calcJual=()=>jualItems.reduce((s,it)=>{const m=sampahMaster.find(x=>x.nama===it.jenis); return s+(parseFloat(it.kg)||0)*(m?hj(m):0)},0);
const calcBeli=()=>beliItems.reduce((s,it)=>{const m=sembakoMaster.find(x=>x.nama===it.nama); return s+(parseInt(it.qty)||0)*(m?hb(m):0)},0);

const doSetor=()=>{if(!setorId){alert("Pilih nasabah");return} const valid=setorItems.filter(it=>it.kg&&parseFloat(it.kg)>0); if(!valid.length){alert("Isi Kg");return} const detail=valid.map(it=>{const m=sampahMaster.find(s=>s.nama===it.jenis); return {jenis:it.jenis,kg:parseFloat(it.kg),harga:hb(m||{}),total:parseFloat(it.kg)*hb(m||{})}}); const total=detail.reduce((a,b)=>a+b.total,0); const ket=detail.map(d=>d.jenis+" "+d.kg+"Kg").join(" + "); const trx={id:"TRX"+Date.now(),idNasabah:setorId,tanggal:new Date().toISOString(),jenis:"setor",keterangan:ket,detail,totalRp:total}; setTransaksi([...transaksi,trx]); setNasabah(nasabah.map(n=>n.id===setorId?{...n,saldo:(n.saldo||0)+total}:n)); let ns=[...sampahMaster]; detail.forEach(d=>{ns=ns.map(s=>s.nama===d.jenis?{...s,stokKg:(s.stokKg||0)+d.kg}:s)}); setSampahMaster(ns); setSetorItems([{jenis:"Botol Plastik",kg:""}]); alert("Setor Rp "+total.toLocaleString()+" sukses!")};
const doTarik=()=>{if(!tarikId){alert("Pilih nasabah");return} const nsb=nasabah.find(n=>n.id===tarikId); let total=0; let ket=""; if(tarikMode==="tunai"){if(!tarikRp){alert("Isi Rp");return} total=parseInt(tarikRp); ket="Tarik Tunai";}else{const valid=tukarItems.filter(it=>it.qty&&parseInt(it.qty)>0); if(!valid.length){alert("Isi qty");return} total=valid.reduce((s,it)=>{const m=sembakoMaster.find(x=>x.nama===it.nama); return s+(parseInt(it.qty)||0)*hj(m||{})},0); ket="Tukar: "+valid.map(it=>it.nama+" x"+it.qty).join(", "); let ns=[...sembakoMaster]; for(const it of valid){const m=ns.find(s=>s.nama===it.nama); if(m&&(m.stok||0)<parseInt(it.qty)){alert("Stok kurang"); return} ns=ns.map(s=>s.nama===it.nama?{...s,stok:(s.stok||0)-parseInt(it.qty)}:s)} setSembakoMaster(ns);} if(!nsb||(nsb.saldo||0)<total){alert("Saldo kurang");return} const trx={id:"TRX"+Date.now(),idNasabah:tarikId,tanggal:new Date().toISOString(),jenis:"tarik",keterangan:ket+" ("+tarikMode+")",totalRp:total}; setTransaksi([...transaksi,trx]); setNasabah(nasabah.map(n=>n.id===tarikId?{...n,saldo:(n.saldo||0)-total}:n)); setTarikRp(""); setTukarItems([{nama:"Beras 1Kg",qty:""}]); alert("Tarik sukses!")};
const doJual=()=>{const valid=jualItems.filter(it=>it.kg&&parseFloat(it.kg)>0); if(!valid.length){alert("Isi Kg");return} for(const it of valid){const m=sampahMaster.find(s=>s.nama===it.jenis); if(m&&(m.stokKg||0)<parseFloat(it.kg)){alert(`Stok ${it.jenis} kurang!`); return}} const detail=valid.map(it=>{const m=sampahMaster.find(s=>s.nama===it.jenis); return {jenis:it.jenis,kg:parseFloat(it.kg),harga:hj(m||{}),total:parseFloat(it.kg)*hj(m||{})}}); const total=detail.reduce((a,b)=>a+b.total,0); let ns=[...sampahMaster]; detail.forEach(d=>{ns=ns.map(s=>s.nama===d.jenis?{...s,stokKg:(s.stokKg||0)-d.kg}:s)}); setSampahMaster(ns); const kas={id:"KAS"+Date.now(),tanggal:new Date().toISOString(),jenis:"jual_plastik",keterangan:"Jual ke Pengepul: "+detail.map(d=>d.jenis+" "+d.kg+"Kg").join(" + ")+(jualKet?" - "+jualKet:""),masuk:total,keluar:0}; setKasTransaksi([...kasTransaksi,kas]); setJualItems([{jenis:"Botol Plastik",kg:""}]); setJualKet(""); alert(`Jual Rp ${total.toLocaleString()} sukses!`);};
const doBeli=()=>{const valid=beliItems.filter(it=>it.qty&&parseInt(it.qty)>0); if(!valid.length){alert("Isi Qty");return} const detail=valid.map(it=>{const m=sembakoMaster.find(s=>s.nama===it.nama); return {nama:it.nama,qty:parseInt(it.qty),harga:hb(m||{}),total:parseInt(it.qty)*hb(m||{})}}); const total=detail.reduce((a,b)=>a+b.total,0); let ns=[...sembakoMaster]; detail.forEach(d=>{ns=ns.map(s=>s.nama===d.nama?{...s,stok:(s.stok||0)+d.qty}:s)}); setSembakoMaster(ns); const kas={id:"KAS"+Date.now(),tanggal:new Date().toISOString(),jenis:"beli_sembako",keterangan:"Beli dari Grosir: "+detail.map(d=>d.nama+" x"+d.qty).join(" + ")+(beliKet?" - "+beliKet:""),masuk:0,keluar:total}; setKasTransaksi([...kasTransaksi,kas]); setBeliItems([{nama:"Beras 1Kg",qty:""}]); setBeliKet(""); alert(`Beli Rp ${total.toLocaleString()} sukses!`);};

const trxBuku=buku?transaksi.filter(t=>t.idNasabah===buku.id).sort((a,b)=>new Date(a.tanggal)-new Date(b.tanggal)):[];
let run=0; const trxRun=trxBuku.map(t=>{if(t.jenis==="setor") run+=t.totalRp; else run-=t.totalRp; return {...t,saldoAkhir:run}});

return (<div>
<header className="bg-emerald-700 text-white p-3 flex gap-3 items-center">
{identity.logoBase64?<img src={identity.logoBase64} className="w-12 h-12 rounded-full border-2 border-white object-cover"/>:<div className="w-12 h-12 rounded-full bg-white text-emerald-700 flex items-center justify-center font-bold">BP</div>}
<div className="flex-1"><div className="font-bold">{identity.namaBank} <span className="text-xs bg-white text-emerald-700 px-2 py-1 rounded-full ml-2">V9.5 FINAL</span></div><div className="text-xs opacity-90">Saldo Nasabah Rp {totalSaldo.toLocaleString()} | Kas Rp {kasSaldo.toLocaleString()} | Stok {totalStokKg}Kg</div></div>
</header>
<nav className="bg-white p-2 flex gap-2 overflow-x-auto scrollbar-hide sticky top-0 z-40 border-b">
{tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-2 rounded-full whitespace-nowrap text-xs font-medium ${tab===t.id?'bg-emerald-600 text-white':'bg-slate-100'}`}>{t.label}</button>)}
</nav>
<main className="p-3 space-y-3 pb-20">

{tab==="dashboard"&&<div className="space-y-3">
<div className="bg-white p-4 rounded-xl shadow">
<div className="grid grid-cols-2 gap-3">
<div className="bg-slate-50 p-4 rounded-xl"><div className="text-xs text-slate-500">Total Nasabah</div><div className="text-2xl font-bold mt-1">{nasabah.length} Org</div></div>
<div className="bg-slate-50 p-4 rounded-xl"><div className="text-xs text-slate-500">Total Saldo</div><div className="text-xl font-bold mt-1">Rp {totalSaldo.toLocaleString()}</div></div>
<div className="bg-orange-50 p-4 rounded-xl"><div className="text-xs">Stok Sampah</div><div className="text-2xl font-bold mt-1">{totalStokKg}Kg</div><div className="text-xs">Beli Rp {totalNilaiBeli.toLocaleString()} | Jual Rp {totalNilaiJual.toLocaleString()}</div></div>
<div className="bg-emerald-50 p-4 rounded-xl"><div className="text-xs">Laba Bersih</div><div className="text-xl font-bold mt-1 text-emerald-700">Rp {labaBersih.toLocaleString()}</div></div>
</div>
</div>
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-3 text-sm">⚡ Akses Cepat - Lengkap V9.5</div>
<div className="grid grid-cols-3 gap-3">
<button onClick={()=>setTab('setor')} className="bg-emerald-600 text-white p-4 rounded-xl flex flex-col items-center gap-1"><span className="text-2xl">♻️</span><span className="text-xs font-bold">Setor Multi Jenis</span></button>
<button onClick={()=>setTab('tarik')} className="bg-red-500 text-white p-4 rounded-xl flex flex-col items-center gap-1"><span className="text-2xl">💸</span><span className="text-xs font-bold">Tarik Tunai / Sembako</span></button>
<button onClick={()=>setTab('buku')} className="bg-slate-800 text-white p-4 rounded-xl flex flex-col items-center gap-1"><span className="text-2xl">📒</span><span className="text-xs font-bold">Buku Tabungan</span></button>
</div>
<div className="grid grid-cols-3 gap-3 mt-3">
<button onClick={()=>setTab('jual')} className="bg-purple-600 text-white p-3 rounded-xl flex flex-col items-center gap-1"><span className="text-xl">💰</span><span className="text-[10px] font-bold">Jual Plastik ke Pengepul</span></button>
<button onClick={()=>setTab('beli')} className="bg-orange-600 text-white p-3 rounded-xl flex flex-col items-center gap-1"><span className="text-xl">🛒</span><span className="text-[10px] font-bold">Beli Sembako dari Grosir</span></button>
<button onClick={()=>setTab('export')} className="bg-blue-600 text-white p-3 rounded-xl flex flex-col items-center gap-1"><span className="text-xl">📊</span><span className="text-[10px] font-bold">Export Excel & Reset</span></button>
</div>
</div>
</div>}

{tab==="identitas"&&<div className="bg-white p-4 rounded-xl shadow space-y-3">
<div className="font-bold">🏦 Identitas Bank Lengkap V9.5</div>
<div className="flex gap-3 items-center p-3 bg-slate-50 rounded-xl">
{identity.logoBase64?<img src={identity.logoBase64} className="w-20 h-20 rounded-full border-2 border-emerald-300 object-cover"/>:<div className="w-20 h-20 bg-slate-200 rounded-full flex items-center justify-center font-bold">BP</div>}
<div className="flex-1"><input type="file" accept="image/*" onChange={handleLogo} className="text-xs w-full"/><div className="text-[10px] text-slate-500 mt-1">Logo</div></div>
</div>
<div className="space-y-2">
<div><label className="text-xs font-bold">Nama Bank</label><input value={identity.namaBank} onChange={e=>setIdentity({...identity,namaBank:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div>
<div><label className="text-xs font-bold">Alamat Lengkap</label><input value={identity.alamat} onChange={e=>setIdentity({...identity,alamat:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div>
<div className="grid grid-cols-2 gap-2"><div><label className="text-xs font-bold">RT/RW</label><input value={identity.rt_rw} onChange={e=>setIdentity({...identity,rt_rw:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div><div><label className="text-xs font-bold">Kelurahan</label><input value={identity.kelurahan} onChange={e=>setIdentity({...identity,kelurahan:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div></div>
<div className="grid grid-cols-2 gap-2"><div><label className="text-xs font-bold">Kecamatan</label><input value={identity.kecamatan} onChange={e=>setIdentity({...identity,kecamatan:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div><div><label className="text-xs font-bold">Kabupaten</label><input value={identity.kabupaten} onChange={e=>setIdentity({...identity,kabupaten:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div></div>
<div><label className="text-xs font-bold">Penanggung Jawab</label><input value={identity.penanggungJawab} onChange={e=>setIdentity({...identity,penanggungJawab:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div>
<div><label className="text-xs font-bold">No Telp / WA</label><input value={identity.telp} onChange={e=>setIdentity({...identity,telp:e.target.value})} className="w-full border p-3 rounded-lg mt-1 text-sm"/></div>
</div>
<button onClick={()=>alert('Identitas disimpan!')} className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold">💾 Simpan</button>
</div>}

{tab==="master"&&<div className="space-y-3">
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-2 text-sm">♻️ Master Sampah - Edit Harga Beli & Jual V9.5 ✅</div>
<div className="text-xs bg-yellow-50 border p-2 rounded mb-2">Harga Beli dari nasabah, Harga Jual ke pengepul. Edit di sini, langsung ngaruh ke Setor & Jual!</div>
{sampahMaster.map((s,i)=><div key={i} className="flex gap-1 mb-2 items-center">
<input value={s.nama} onChange={e=>{const a=[...sampahMaster]; a[i].nama=e.target.value; setSampahMaster(a)}} className="flex-1 border p-2 rounded text-xs"/>
<input type="number" value={hb(s)} onChange={e=>{const a=[...sampahMaster]; a[i].hargaBeli=parseInt(e.target.value)||0; setSampahMaster(a)}} className="w-20 border p-2 rounded text-xs" placeholder="Beli"/>
<input type="number" value={hj(s)} onChange={e=>{const a=[...sampahMaster]; a[i].hargaJual=parseInt(e.target.value)||0; setSampahMaster(a)}} className="w-20 border p-2 rounded text-xs bg-purple-50" placeholder="Jual"/>
<span className="text-xs w-8">{s.stokKg||0}Kg</span>
<button onClick={()=>setSampahMaster(sampahMaster.filter((_,idx)=>idx!==i))} className="bg-red-100 px-2 py-2 rounded text-xs">X</button>
</div>)}
<button onClick={()=>setSampahMaster([...sampahMaster,{nama:"Baru",hargaBeli:1000,hargaJual:2000,stokKg:0}])} className="w-full bg-emerald-50 py-2 rounded border font-bold text-xs">+ Tambah Sampah</button>
</div>
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-2 text-sm">🛒 Master Sembako - Edit Harga Jual ✅</div>
<div className="text-xs bg-blue-50 border p-2 rounded mb-2">Harga Beli dari grosir & Harga Jual ke nasabah. Edit di sini!</div>
{sembakoMaster.map((s,i)=><div key={i} className="flex gap-1 mb-2 items-center">
<input value={s.nama} onChange={e=>{const a=[...sembakoMaster]; a[i].nama=e.target.value; setSembakoMaster(a)}} className="flex-1 border p-2 rounded text-xs"/>
<input type="number" value={hb(s)} onChange={e=>{const a=[...sembakoMaster]; a[i].hargaBeli=parseInt(e.target.value)||0; setSembakoMaster(a)}} className="w-20 border p-2 rounded text-xs" placeholder="Beli"/>
<input type="number" value={hj(s)} onChange={e=>{const a=[...sembakoMaster]; a[i].hargaJual=parseInt(e.target.value)||0; setSembakoMaster(a)}} className="w-20 border p-2 rounded text-xs bg-emerald-50 font-bold" placeholder="Jual"/>
<input type="number" value={s.stok||0} onChange={e=>{const a=[...sembakoMaster]; a[i].stok=parseInt(e.target.value)||0; setSembakoMaster(a)}} className="w-14 border p-2 rounded text-xs"/>
<button onClick={()=>setSembakoMaster(sembakoMaster.filter((_,idx)=>idx!==i))} className="bg-red-100 px-2 py-2 rounded text-xs">X</button>
</div>)}
<button onClick={()=>setSembakoMaster([...sembakoMaster,{nama:"Baru",hargaBeli:10000,hargaJual:12000,stok:10}])} className="w-full bg-blue-50 py-2 rounded border font-bold text-xs">+ Tambah Sembako</button>
</div>
</div>}

{tab==="laporan"&&<div className="space-y-3">
<div className="bg-white p-4 rounded-xl shadow">
<div className="font-bold mb-2 text-sm">📊 Laporan Transaksi Lengkap V9.5 ✅</div>
<div className="text-xs bg-green-50 border p-2 rounded mb-2">Semua transaksi setor, tarik, jual plastik, beli sembako muncul di sini.</div>
<div className="space-y-2 max-h-96 overflow-auto">
{transaksi.slice().reverse().map(t=>{
  const nsb=nasabah.find(n=>n.id===t.idNasabah);
  return <div key={t.id} className="border p-2 rounded text-xs flex justify-between">
